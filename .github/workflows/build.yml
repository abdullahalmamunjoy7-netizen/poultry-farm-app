name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Setup
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Platform
        run: |
          mkdir -p lib
          # যদি ভুলবশত main.dart বাইরে থাকে, তবে তা lib ফোল্ডারে নিয়ে আসবে
          if [ -f main.dart ]; then
            mv main.dart lib/main.dart
          fi
          # main.dart ব্যাকআপ নেওয়া
          if [ -f lib/main.dart ]; then
            cp lib/main.dart lib/main_temp.dart
          fi
          # হাইফেন সমস্যা সমাধান করে অ্যান্ড্রয়েড ফাইল তৈরি করা
          flutter create . --project-name poultry_manager --platforms=android --org com.poultry.manager
          # মূল কোড ফিরিয়ে আনা
          if [ -f lib/main_temp.dart ]; then
            mv lib/main_temp.dart lib/main.dart
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poultry-farm-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
