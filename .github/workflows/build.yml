name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Setup
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Platform
        run: |
          mkdir -p lib
          # যদি main.dart বাইরে থাকে, তবে lib ফোল্ডারে নিবে
          if [ -f main.dart ]; then
            mv main.dart lib/main.dart
          fi
          # অ্যান্ড্রয়েড ফাইলগুলো তৈরি করা
          flutter create . --project-name poultry_manager --platforms=android --org com.poultry.manager --no-pub
          # আপনার আসল কোডটি নিশ্চিতভাবে ফিরিয়ে আনা
          git checkout HEAD -- lib/main.dart || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poultry-farm-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
