name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Setup
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Assets & Platform
        run: |
          mkdir -p lib assets
          # যদি লোগো মূল ফোল্ডারে থাকে, assets এ নিয়ে যাওয়া
          if [ -f logo.png ]; then
            mv logo.png assets/logo.png
          fi
          if [ -f main.dart ]; then
            mv main.dart lib/main.dart
          fi
          flutter create . --project-name smart_khamari --platforms=android --org com.engineersagro.smartkhamari --no-pub
          git checkout HEAD -- lib/main.dart || true
          # মোবাইলে অ্যাপের নাম 'স্মার্ট খামারি' সেট করা
          sed -i 's/android:label=".*"/android:label="স্মার্ট খামারি"/g' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon from Logo
        run: |
          if [ -f assets/logo.png ]; then
            dart run flutter_launcher_icons
          fi

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-khamari-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
